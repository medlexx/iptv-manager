# =============================================================================
# IPTV SOURCES
# =============================================================================
#
# priority:
#
#   100 = самый высокий приоритет
#    80 = высокий
#    50 = обычный
#    20 = резервный
#    10 = низкий
#
# Скрипт сначала ищет рабочий URL среди источников
# с максимальным priority.
#
# ВАЖНО:
# URL должны вести непосредственно на M3U/M3U8/TXT список.
# =============================================================================

sources:

  # ---------------------------------------------------------------------------
  # PREMIUM
  # ---------------------------------------------------------------------------

  - name: "premium-1"
    url: "https://YOUR-SOURCE-1.example/playlist.m3u"
    priority: 100
    enabled: true

  - name: "premium-2"
    url: "https://YOUR-SOURCE-2.example/playlist.m3u"
    priority: 100
    enabled: true


  # ---------------------------------------------------------------------------
  # MAIN
  # ---------------------------------------------------------------------------

  - name: "main-1"
    url: "https://YOUR-SOURCE-3.example/playlist.m3u"
    priority: 50
    enabled: true

  - name: "main-2"
    url: "https://YOUR-SOURCE-4.example/playlist.m3u"
    priority: 50
    enabled: true


  # ---------------------------------------------------------------------------
  # BACKUP
  # ---------------------------------------------------------------------------

  - name: "backup-1"
    url: "https://YOUR-SOURCE-5.example/playlist.m3u"
    priority: 20
    enabled: true

  - name: "backup-2"
    url: "https://YOUR-SOURCE-6.example/playlist.m3u"
    priority: 20
    enabled: true