sources:

  # ==========================================================
  # ЛОКАЛЬНЫЕ ФАЙЛЫ
  #
  # Все M3U/M3U8/TXT внутри каталога sources/
  # программа обнаруживает автоматически.
  # ==========================================================

  # Пример отдельного локального источника:
  #
  # - name: "my_local_source"
  #   type: "local"
  #   path: "sources/my_playlist.m3u"
  #   priority: 50
  #   enabled: true


  # ==========================================================
  # БУДУЩИЕ УДАЛЁННЫЕ ПЛЕЙЛИСТЫ
  # ==========================================================

  # Раскомментируй и вставь URL:
  #
  # - name: "remote_source_1"
  #   type: "remote"
  #   url: "https://example.com/playlist.m3u"
  #   priority: 100
  #   enabled: true

  # - name: "remote_source_2"
  #   type: "remote"
  #   url: "https://example.com/playlist2.m3u8"
  #   priority: 80
  #   enabled: true