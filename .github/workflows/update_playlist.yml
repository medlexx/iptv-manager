name: Update IPTV Playlist

on:

  # Ручной запуск из GitHub Actions.
  workflow_dispatch:

  # Автоматический запуск.
  # GitHub использует UTC.
  schedule:
    - cron: "*/30 * * * *"

  # Обновление после изменения конфигурации,
  # spisok.txt, aliases, sources или самого скрипта.
  push:
    paths:
      - "iptv_manager.py"
      - "config.yaml"
      - "sources.yaml"
      - "channels.yaml"
      - "aliases.yaml"
      - "spisok.txt"
      - "sources/**"
      - "requirements.txt"


permissions:
  contents: write


concurrency:
  group: iptv-playlist-update
  cancel-in-progress: true


jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ========================================================
      # PYTHON
      # ========================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"


      # ========================================================
      # FFMPEG / FFPROBE
      # ========================================================

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg


      # ========================================================
      # PYTHON DEPENDENCIES
      # ========================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ========================================================
      # CREATE DIRECTORIES
      # ========================================================

      - name: Prepare directories
        run: |
          mkdir -p data
          mkdir -p output
          mkdir -p logs
          mkdir -p downloaded_sources


      # ========================================================
      # RUN MANAGER
      # ========================================================

      - name: Update playlist
        run: |
          python iptv_manager.py


      # ========================================================
      # SHOW RESULT
      # ========================================================

      - name: Show generated playlist statistics
        run: |
          echo "======================================"
          echo "Generated playlist:"
          echo "======================================"

          if [ -f output/eternal_playlist.m3u8 ]; then
            echo "Playlist exists."
            echo "Lines:"
            wc -l output/eternal_playlist.m3u8
            echo "Channels:"
            grep -c "^#EXTINF" output/eternal_playlist.m3u8 || true
          else
            echo "ERROR: playlist was not generated."
            exit 1
          fi


      # ========================================================
      # COMMIT RESULT
      # ========================================================

      - name: Commit generated files
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            output/eternal_playlist.m3u8 \
            data/channel_index.db

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "Auto update IPTV playlist"

          git push