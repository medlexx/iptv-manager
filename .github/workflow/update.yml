name: Update Playlist

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create output dir
        run: mkdir -p output

      - name: Run update
        run: python iptv_manager.py --once
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit result
        run: |
          git config user.name "iptv-bot"
          git config user.email "bot@users.noreply.github.com"
          git add output/playlist.m3u8 || true
          git diff --staged --quiet || git commit -m "Update playlist"
          git push