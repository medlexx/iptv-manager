# =============================================================================
# IPTV MANAGER CONFIGURATION
# =============================================================================

matching:

  # Минимальное fuzzy-сходство названия.
  #
  # 0.78 = достаточно безопасный уровень.
  #
  # Если источники используют очень разные названия,
  # можно постепенно уменьшить до 0.72.
  fuzzy_threshold: 0.78

  min_normalized_length: 2


# =============================================================================
# VALIDATION
# =============================================================================

validation:

  # Общий HTTP timeout.
  http_timeout: 12

  # Таймаут подключения.
  connect_timeout: 7

  # Таймаут чтения данных.
  read_timeout: 10

  # Максимальное количество одновременных проверок.
  max_concurrent: 30

  # Если ffprobe установлен — дополнительно проверять,
  # действительно ли URL отдаёт аудио/видео.
  validate_with_ffprobe: true

  # Таймаут ffprobe.
  ffprobe_timeout: 10

  # Сколько байт читать при HTTP-проверке.
  http_chunk_size: 8192

  # Минимальный размер ответа.
  min_http_bytes: 256

  # Количество повторных попыток.
  retries: 2


# =============================================================================
# SOURCES
# =============================================================================

sources:

  # Таймаут скачивания M3U-файла.
  download_timeout: 60

  # Максимальный размер одного источника.
  max_download_size_mb: 100

  # Разрешить локальные файлы из директории sources/.
  allow_local_files: true


# =============================================================================
# PLAYLIST
# =============================================================================

playlist:

  output_file: "public/eternal_playlist.m3u8"

  encoding: "utf-8"

  include_group: true

  group_title: "IPTV"


# =============================================================================
# SAFETY
# =============================================================================

safety:

  # Обязательное требование:
  # ВСЕ каналы из spisok.txt должны присутствовать.
  require_all_reference_channels: true

  # Никогда не публиковать неполный playlist.
  never_publish_incomplete: true

  # Предыдущий playlist не удалять при ошибке.
  keep_previous_playlist: true


# =============================================================================
# ALIASES
# =============================================================================

# Здесь можно вручную указать нестандартные названия.
#
# Например:
#
# aliases:
#   "Россия 1 HD": "Россия 1"
#   "Россия1": "Россия 1"
#   "Russia 1": "Россия 1"
#
# Левая часть = название в источнике.
# Правая часть = точное название в spisok.txt.

aliases: {}


# =============================================================================
# DIAGNOSTICS
# =============================================================================

diagnostic_mode: true