sources:
  local_directory: "sources"
  download_directory: "downloaded_sources"
  remote_enabled: true

database:
  path: "data/channel_index.db"

output:
  playlist: "output/eternal_playlist.m3u8"

  # Даже если URL временно не найден,
  # название канала остаётся в playlist.
  include_unavailable: true

  unavailable_url: "http://127.0.0.1:9/unavailable"

matching:
  fuzzy_enabled: true

  # Высокий порог специально выбран для защиты
  # от неправильного сопоставления похожих названий.
  fuzzy_threshold: 0.88

  minimum_normalized_length: 2

validation:
  enabled: true

  http_timeout: 8

  ffprobe_enabled: true
  ffprobe_timeout: 8

  max_concurrent: 20

  # Через 30 минут URL проверяется снова.
  cache_ttl: 1800

  retry_count: 1

playlist:
  sort_by: "reference_order"
  default_group: "TV"

remote:
  refresh_hours: 6

diagnostics:
  enabled: true
  unmatched_limit: 30